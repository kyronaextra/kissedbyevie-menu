# Static site. Clean paths are real directories (menu/index.html and the
# same for checkout, gallery, and about), so Render can serve /menu and
# /menu/ without a catch-all rewrite. These rewrites cover hosts that do
# not map a directory index onto the slashless path. Existing files such
# as /checkout.html win over rules, because Render skips a rule when a
# resource already exists at that path.
services:
  - type: web
    name: kissedbyevie-menu
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /menu
        destination: /menu/index.html
      - type: rewrite
        source: /checkout
        destination: /checkout/index.html
      - type: rewrite
        source: /gallery
        destination: /gallery/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
    # Render purges the CDN on each deploy. Files under /assets keep a long
    # cache. HTML is revalidated. CSS and JS at the site root are cache-busted
    # with a query string and are not marked immutable, because the filenames
    # do not include a content hash. A catch-all /* header is omitted so it
    # cannot override the asset rule.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /menu
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /menu/index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /checkout
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /checkout/index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /checkout.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /gallery
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /gallery/index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /gallery.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /about
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /about/index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /about.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
