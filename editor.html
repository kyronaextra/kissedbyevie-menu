<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Photo Studio · Kissed by Evie</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="member-config.js"></script><script defer src="editor.js"></script></head><body class="editor-page"><main class="studio-wrap"><a href="./">← Back to the site</a><h1>My Photo Studio</h1><p>Upload photos and choose where they appear on the public site.</p><p id="studioStatus" role="status"></p><section id="studioLogin"><h2>Owner sign in</h2><form id="studioLoginForm"><label>Email<input id="studioEmail" type="email" required autocomplete="username"></label><label>Password<input id="studioPassword" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></section><section id="studioMain" hidden><button id="studioSignout" type="button">Sign out</button><h2>Add photos</h2><form id="studioUploadForm"><label>Photos<input id="studioFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><label>Placement<select id="studioPlacement"><option value="gallery">Gallery</option><option value="hero">Homepage</option><option value="about">About</option><option value="menu">Menu preview</option><option value="featured">Featured</option></select></label><label>Caption<input id="studioCaption" maxlength="160" placeholder="A short description"></label><button id="studioUpload" type="submit">Upload photos</button></form><h2>Manage photos</h2><div id="studioCards"></div></section></main></body></html>
