<style>
:root{--black:#000;--deep:#0D0614;--pink:#FF2E9A;--chrome-pink:#FF6BC9;--glow:#FF4FD8;--silver:#C0C0C0;--white:#F5F0F8;--soft:#E8A0C8}
html{background:var(--black);scroll-padding-top:80px}
body.gallery-page{min-height:100vh;color:var(--white);background-color:var(--black);background-image:radial-gradient(ellipse at 0% 0%,rgba(255,79,216,.13),transparent 28rem),radial-gradient(ellipse at 100% 35%,rgba(255,46,154,.09),transparent 32rem),radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.8) 0 1px,transparent 1.8px),radial-gradient(1px 1px at 120px 95px,rgba(255,107,201,.65) 0 1px,transparent 1.8px),radial-gradient(1px 1px at 190px 160px,rgba(255,255,255,.45) 0 1px,transparent 1.8px);background-size:auto,auto,180px 170px,240px 220px,290px 240px}
.gallery-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,4vw,54px);background:rgba(0,0,0,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(192,192,192,.48);box-shadow:0 6px 22px rgba(0,0,0,.48)}
.gallery-wordmark{white-space:nowrap;text-decoration:none;font:900 clamp(13px,1.8vw,19px)/1 Georgia,serif;letter-spacing:.08em;color:var(--chrome-pink);text-shadow:0 0 9px rgba(255,79,216,.32)}
.gallery-nav{display:flex;align-items:center;gap:7px}
.gallery-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:37px;padding:8px 11px;border:1px solid rgba(192,192,192,.58);border-radius:999px;background:rgba(13,6,20,.9);color:var(--white);text-decoration:none;font:700 10px/1 "DM Sans",sans-serif;letter-spacing:.07em}
.gallery-nav a[aria-current=page]{border-color:var(--silver);background:linear-gradient(110deg,var(--pink),var(--chrome-pink),var(--pink));box-shadow:0 0 12px rgba(255,79,216,.28);color:#fff}
.gallery-main{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:clamp(42px,8vw,92px) 0 72px}
.gallery-heading{text-align:center;margin:0 auto 28px}
.gallery-kicker{margin:0;color:var(--chrome-pink);font:800 10px/1.5 "DM Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase}
.gallery-heading h1{margin:10px 0 8px;color:var(--chrome-pink);font:normal clamp(42px,8vw,76px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;text-shadow:0 0 12px rgba(255,79,216,.26)}
.gallery-heading h1 em{font-weight:normal;color:#fff}
.gallery-heading p:last-child{max-width:520px;margin:12px auto 0;color:var(--white);font:400 clamp(14px,2vw,17px)/1.55 "DM Sans",sans-serif}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gallery-photo{display:block;aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(192,192,192,.58);border-radius:14px;background:#0D0614;box-shadow:0 10px 30px rgba(0,0,0,.42),0 0 14px rgba(255,79,216,.12)}
.gallery-photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease,filter .35s ease}
.gallery-photo:hover img{transform:scale(1.035);filter:saturate(1.07)}
.gallery-photo:focus-visible{outline:3px solid var(--chrome-pink);outline-offset:4px}
.gallery-footer{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:20px 16px 34px;border-top:1px solid rgba(255,46,154,.35);color:var(--soft);font:600 11px/1.5 "DM Sans",sans-serif;letter-spacing:.04em}
.gallery-footer a{color:var(--soft);text-decoration:none}
.gallery-footer a:hover{color:#fff}
@media(max-width:760px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery-main{width:calc(100% - 28px);padding-top:42px}.gallery-photo{border-radius:11px}}
@media(max-width:380px){.gallery-wordmark{font-size:12px;letter-spacing:.06em}.gallery-nav{gap:4px}.gallery-nav a{min-height:34px;padding:7px 8px;font-size:9px}}
@media(prefers-reduced-motion:reduce){.gallery-photo img{transition:none}}
</style>
